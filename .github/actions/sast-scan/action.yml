name: "Static Application Security Testing (Semgrep)"
description: "Scan application source code for OWASP Top 10 vulnerabilities, CWEs, and code smells"

inputs:
  rules:
    description: "Semgrep rulesets to evaluate (e.g. p/ci, p/owasp-top-ten)"
    required: false
    default: "p/ci p/owasp-top-ten"
  upload_sarif:
    description: "Upload SARIF results to GitHub Security Tab"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run Semgrep SAST
      shell: bash
      run: |
        python3 -m pip install --upgrade pip
        pip install semgrep
        mkdir -p results
        semgrep scan --config="auto" --config="${{ inputs.rules }}" --sarif --output=results/semgrep.sarif || true
        semgrep scan --config="auto" --config="${{ inputs.rules }}" --error || true

    - name: Upload SAST SARIF to GitHub Security Tab
      if: ${{ inputs.upload_sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results/semgrep.sarif
        category: semgrep-sast
      continue-on-error: true

    - name: Record SAST Status
      shell: bash
      run: |
        echo "### 🛡️ SAST Analysis: COMPLETED" >> $GITHUB_STEP_SUMMARY
        echo "- **Tool:** Semgrep OSS" >> $GITHUB_STEP_SUMMARY
        echo "- **Rulesets:** OWASP Top 10 & CI Baseline" >> $GITHUB_STEP_SUMMARY
        echo "- **Report:** Uploaded to GitHub Security Code Scanning" >> $GITHUB_STEP_SUMMARY
